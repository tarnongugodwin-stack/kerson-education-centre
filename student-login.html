<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | KERSON Education Center</title>

    <link rel="stylesheet" href="Css/style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #f4f7fb;
        }

        .login-header {
            background: #123b72;
            padding: 20px 5%;
        }

        .login-header a {
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .login-header span {
            color: #f4b400;
        }

        .login-container {
            width: 92%;
            max-width: 430px;
            margin: 55px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .login-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            display: grid;
            place-items: center;
            background: #e9f0fb;
            color: #123b72;
            border-radius: 50%;
            font-size: 30px;
        }

        .login-container h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .login-description {
            text-align: center;
            margin-bottom: 28px;
            color: #64748b;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #10243e;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #123b72;
            box-shadow: 0 0 0 3px rgba(18, 59, 114, 0.1);
        }

        .password-wrapper {
            display: flex;
            gap: 8px;
        }

        .password-wrapper input {
            flex: 1;
            min-width: 0;
        }

        .show-password {
            border: none;
            background: #e9f0fb;
            color: #123b72;
            padding: 0 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            background: #123b72;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #0c2c57;
        }

        .login-message {
            margin-top: 15px;
            font-size: 0.9rem;
            text-align: center;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #123b72;
            font-weight: bold;
        }

        .login-footer {
            margin-top: auto;
            background: #10243e;
            color: white;
            text-align: center;
            padding: 20px 10px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 25px 20px;
                margin: 35px auto;
            }
        }
    </style>
</head>

<body>

    <header class="login-header">
        <a href="index.html">
            KERSON <span>EDUCATION CENTER</span>
        </a>
    </header>

    <main class="login-container">

        <div class="login-icon">🎓</div>

        <h1>Student Login</h1>

        <p class="login-description">
            Welcome back! Enter your student details below.
        </p>

        <form id="studentLoginForm">

            <div class="form-group">
                <label for="matricNumber">Matriculation Number</label>

                <input
                    type="text"
                    id="matricNumber"
                    name="matricNumber"
                    placeholder="Enter your matric number"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="togglePassword"
                    >
                        Show
                    </button>
                </div>
            </div>

            <button type="submit" class="login-button">
                Login to Student Portal
            </button>

            <p
                id="loginMessage"
                class="login-message"
                role="status"
                aria-live="polite"
            ></p>

        </form>

        <a href="index.html" class="back-home">
            ← Back to Homepage
        </a>

    </main>

    <footer class="login-footer">
        <p>
            &copy; <span id="year"></span>
            KERSON Education Center, Atonko Gboko.
        </p>
    </footer>

    <script>
        document.getElementById("year").textContent =
            new Date().getFullYear();

        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        togglePassword.addEventListener("click", function () {
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                togglePassword.textContent = "Hide";
            } else {
                passwordInput.type = "password";
                togglePassword.textContent = "Show";
            }
        });

        document.getElementById("studentLoginForm")
            .addEventListener("submit", function (event) {
                event.preventDefault();

                document.getElementById("loginMessage").textContent =
                    "The login system is not connected yet. Please try again after setup.";

                document.getElementById("loginMessage").style.color =
                    "#b45309";
            });
    </script>

</body>
  </html>
